name: Update Organization Members

on:
  schedule:
    - cron: '0 12 * * *'  # Daily at 20:00 UTC+8 (12:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-members:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Fetch organization members
        id: members
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          MEMBERS=$(gh api /orgs/BorneoBiodiverse/members --paginate --jq '.[] | "\(.login)|\(.avatar_url)|\(.html_url)"')
          echo "members<<EOF" >> $GITHUB_OUTPUT
          echo "$MEMBERS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update README with members
        env:
          MEMBERS: ${{ steps.members.outputs.members }}
        run: |
          README="profile/README.md"
          
          # Build 4-column HTML grid
          MEMBERS_HTML=""
          COL=0
          while IFS='|' read -r login avatar_url html_url; do
            [ -z "$login" ] && continue
            if [ $COL -eq 0 ]; then
              MEMBERS_HTML+="<tr>"
            fi
            MEMBERS_HTML+="<td align=\"center\" width=\"25%\"><a href=\"$html_url\"><img src=\"$avatar_url\" width=\"60\" height=\"60\" style=\"border-radius: 50%;\" /><br /><sub><b>@$login</b></sub></a></td>"
            COL=$((COL + 1))
            if [ $COL -eq 4 ]; then
              MEMBERS_HTML+="</tr>"
              COL=0
            fi
          done <<< "$MEMBERS"
          
          # Close last row if needed
          if [ $COL -gt 0 ]; then
            # Fill remaining cells
            while [ $COL -lt 4 ]; do
              MEMBERS_HTML+="<td></td>"
              COL=$((COL + 1))
            done
            MEMBERS_HTML+="</tr>"
          fi
          
          if [ -z "$MEMBERS_HTML" ]; then
            MEMBERS_HTML="<tr><td colspan=\"4\" align=\"center\">No public members found</td></tr>"
          fi
          
          MEMBERS_MD="<table><tbody>$MEMBERS_HTML</tbody></table>"
          
          # Add timestamp
          TIMESTAMP="*Last updated: $(date -u +"%Y-%m-%d %H:%M UTC")*"
          
          # Replace content between ORG_MEMBERS_START and ORG_MEMBERS_END markers
          awk -v members_md="$MEMBERS_MD" -v ts="$TIMESTAMP" '
            /<!-- ORG_MEMBERS_START -->/ { print; print ""; print members_md; print ""; print ts; in_block=1; next }
            /<!-- ORG_MEMBERS_END -->/ { in_block=0; print; next }
            in_block { next }
            { print }
          ' "$README" > "$README.tmp" && mv "$README.tmp" "$README"

      - name: Commit and push changes
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Configure git to use the PAT for pushing
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/BorneoBiodiverse/.github.git
          if ! git diff --quiet profile/README.md; then
            git add profile/README.md
            git commit -m "chore: update organization members [skip ci]"
            # Pull with rebase to handle concurrent updates, then push
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit"
          fi